name: olcOS Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go core and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The Go core and the server side are the olcos-core submodule
      # (olcOS/olcos-core), the same core the iOS app binds.
      - name: Checkout the app and the olcos-core submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      # The pinned upstream commit the app names must be the one olcos-core
      # is based on, or a server the app installs runs another core.
      - name: Check the core pin
        run: |
          pin=$(sed -n 's/^OLCRTC_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' olcos-core/olcrtc.upstream)
          grep -q "const val CORE_PIN = \"$pin\"" app/src/main/java/io/olcos/app/core/Maintenance.kt \
            || { echo "Maintenance.CORE_PIN must be $pin (olcos-core/olcrtc.upstream)" >&2; exit 1; }

      - name: Core cache key
        id: corekey
        run: |
          echo "key=$(git -C olcos-core rev-parse HEAD)-$(sha256sum scripts/build-core.sh | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Restore the bound core
        id: corecache
        uses: actions/cache/restore@v5
        with:
          path: app/libs/olcoscore.aar
          key: olcoscore-aar-v2-${{ steps.corekey.outputs.key }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        if: steps.corecache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: olcos-core/mobile/go.mod
          cache-dependency-path: |
            olcos-core/go.sum
            olcos-core/mobile/go.sum
            olcos-core/olcrtc/go.sum

      - name: Bind the Go core
        if: steps.corecache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: bash scripts/build-core.sh app/libs/olcoscore.aar

      - name: Save the bound core
        if: steps.corecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: app/libs/olcoscore.aar
          key: ${{ steps.corecache.outputs.cache-primary-key }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # What the app carries for the server (srv.sh, the core patch series,
      # add-carrier.sh, rotate-key.sh, the agent's status scripts, the agent
      # and bond sources), from the same olcos-core commit; never committed.
      - name: Give the app the server side
        run: bash scripts/sync-core-assets.sh

      - name: Materialize the shared debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/olcos-debug.p12"
            echo "OLCOS_DEBUG_KEYSTORE=$RUNNER_TEMP/olcos-debug.p12" >> "$GITHUB_ENV"
            echo "signing with the shared debug keystore"
          else
            echo "no DEBUG_KEYSTORE_B64 secret: the runner's own debug keystore signs this APK (it will not install over another build)"
          fi

      - name: Run the unit tests
        timeout-minutes: 10
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the debug and release APKs
        timeout-minutes: 25
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Show the signing certificate
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -n 3

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: olcos-android-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The release build, signed with the shared key: what a GitHub release ships.
      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: olcos-android-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
